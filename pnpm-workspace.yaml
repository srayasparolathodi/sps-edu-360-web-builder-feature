packages:
  - 'apps/*'
  - 'api/*'
  - 'libs/*'

# Dependencies allowed (true) or refused (false) to run install scripts.
allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  aws-sdk: false
  core-js: false
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  prisma: true
  unrs-resolver: true
  workerd: true

# Refuse packages published less than a day ago (pnpm 12 default) and fail
# instead of auto-excluding them.
minimumReleaseAgeStrict: true
